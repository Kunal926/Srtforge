[package]
name = "srtforge-studio"
version = "0.1.0"
description = "Srtforge Studio — subtitle generation"
authors = ["Srtforge"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "srtforge_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
anyhow = "1"
uuid = { version = "1.10", features = ["v4"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
